<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Saad Bin Mumtaz, Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39d0d8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
    .fade{animation:fade .9s ease-out both}
    .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .draw{stroke-dasharray:430;stroke-dashoffset:430;animation:draw 1.4s ease-out .5s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .edge{stroke:#58a6ff;stroke-opacity:.5;stroke-width:1.5;stroke-dasharray:6 6;animation:flow 2.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .ring{fill:none;stroke:#39d0d8;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-out infinite}
    .r2{animation-delay:1.1s}.r3{animation-delay:2.1s}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}
  </style>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <circle cx="960" cy="150" r="230" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#21262d"/>

  <!-- left: identity -->
  <g class="fade d1">
    <text x="64" y="84" class="mono" font-size="17" fill="#39d0d8">~/saadBinMumtaz<tspan class="cursor" fill="#58a6ff"> _</tspan></text>
  </g>
  <g class="fade d2">
    <text x="62" y="156" class="sans" font-size="60" font-weight="700" fill="#e6edf3" letter-spacing="-1">Saad Bin Mumtaz</text>
  </g>
  <path class="draw" d="M64 176H494" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <g class="fade d3">
    <text x="64" y="214" class="sans" font-size="22" fill="#8b949e">Full-Stack Developer  /  Backend-first  /  Pakistan</text>
    <text x="64" y="250" class="mono" font-size="15" fill="#6e7681">Understand the engineering behind the framework.</text>
  </g>

  <!-- right: small system diagram -->
  <g>
    <line class="edge" x1="850" y1="95" x2="960" y2="150"/>
    <line class="edge" x1="850" y1="205" x2="960" y2="150"/>
    <line class="edge" x1="960" y1="150" x2="1075" y2="95"/>
    <line class="edge" x1="960" y1="150" x2="1075" y2="205"/>

    <circle class="ring" cx="960" cy="150" r="8"/>
    <circle class="ring r2" cx="960" cy="150" r="8"/>
    <circle class="ring r3" cx="960" cy="150" r="8"/>

    <circle cx="850" cy="95" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="850" cy="205" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="1075" cy="95" r="7" fill="#0d1117" stroke="#39d0d8" stroke-width="2"/>
    <circle cx="1075" cy="205" r="7" fill="#0d1117" stroke="#39d0d8" stroke-width="2"/>
    <circle cx="960" cy="150" r="10" fill="#58a6ff"/>

    <g class="mono" font-size="12" fill="#6e7681">
      <text x="800" y="86">client</text>
      <text x="798" y="228">queue</text>
      <text x="945" y="184">api</text>
      <text x="1088" y="90">db</text>
      <text x="1088" y="222">cache</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
